name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint and format
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test
        run: uv run pytest --cov=gpqa_cmab --cov-report=term-missing --cov-fail-under=80

      - name: Mock CLI smoke test
        run: uv run gpqa-cmab smoke-test --mock