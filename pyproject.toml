[project]
name = "gpqa-cmab"
version = "0.1.0"
description = "Local GPQA-Diamond Physics CMAB subagent pruning MVP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
# The openai SDK is the canonical OpenAI-API-compatible client and supports
# any vendor exposing that schema. Both extras names install the same dep.
openai = ["openai>=1.0.0"]
llm = ["openai>=1.0.0"]
# Phase 1 CMAB-GFN explorer (Trajectory Balance). PyTorch is heavy and
# unrelated to the LLM / replay pipeline, so it is gated behind its own extra.
# Install with: ``uv sync --extra gfn``.
gfn = ["torch>=2.0.0"]
# Durable telemetry layer Postgres backend. Default install ships only the
# zero-dep SQLite backend; opt in with ``uv sync --extra telemetry-pg``.
telemetry-pg = ["psycopg[binary]>=3.1.0"]

[project.scripts]
gpqa-cmab = "gpqa_cmab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpqa_cmab"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
    "TRY",  # tryceratops (exception hygiene)
    "PERF", # perflint
    "SLF",  # flake8-self (private member access)
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "FURB", # refurb
    "PLC",  # pylint convention
    "PLE",  # pylint error
    "PLW",  # pylint warning
]
ignore = [
    "ANN401",  # allow `Any` for external/JSON payload boundaries (narrowly used)
    "TRY003",  # external messages in exceptions are fine for a research CLI
    "TRY400",  # logging.error vs logging.exception left to author discretion
    "PLC0415", # lazy imports of optional heavy deps (torch/openai) are deliberate
    "RUF001",  # ambiguous unicode: physics text uses Greek letters intentionally
    "RUF002",  # ambiguous unicode in docstrings (Greek letters)
    "RUF003",  # ambiguous unicode in comments (Greek letters)
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests favour brevity: skip annotation/private-access/magic-value noise and
# allow throwaway stub classes with mutable defaults / single-element indexing.
"tests/**" = ["ANN", "SLF001", "PLW", "PLC", "PLR2004", "RUF012", "RUF015"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["src/gpqa_cmab"]

[[tool.mypy.overrides]]
# torch ships no inline stubs for the slice we use; the gfn extra is optional.
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The gfn subpackage sits directly on the torch boundary. torch's shipped
# type information is incomplete (many tensor ops return ``Any`` and some
# methods are untyped), so we relax those two checks *only here* while
# keeping full def-level annotation enforcement on our own code.
module = ["gpqa_cmab.gfn.*"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---- PyTorch CPU-only wheels ----------------------------------------------
# The Phase-1 CMAB-GFN explorer only needs CPU torch — the default torch
# wheels pull ~3.5 GB of CUDA/NCCL/cuDNN binaries that are pure waste for
# this MVP. The block below routes ``torch`` (and friends) through the
# official PyTorch CPU-only index, mirroring:
#   pip3 install torch --index-url https://download.pytorch.org/whl/cpu
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]