[project]
name = "gpqa-cmab"
version = "0.1.0"
description = "Local GPQA-Diamond Physics CMAB subagent pruning MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
# The openai SDK is the canonical OpenAI-API-compatible client and supports
# any vendor exposing that schema. Both extras names install the same dep.
openai = ["openai>=1.0.0"]
llm = ["openai>=1.0.0"]
# Phase 1 CMAB-GFN explorer (Trajectory Balance). PyTorch is heavy and
# unrelated to the LLM / replay pipeline, so it is gated behind its own extra.
# Install with: ``uv sync --extra gfn``.
gfn = ["torch>=2.0.0"]

[project.scripts]
gpqa-cmab = "gpqa_cmab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpqa_cmab"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"